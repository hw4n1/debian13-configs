[DEFAULT]
pristine-tar = True
cleaner = fakeroot debian/rules clean

[buildpackage]
builder = sbuild --no-clean-source
export-dir = ../build-area/
notify = auto

[import-orig]
pristine-tar = True
merge-mode = replace

[pq]
patch-numbers = True
patch-num-format = %04d-

[dch]
multimaint-merge = True
