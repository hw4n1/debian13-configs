# ── aureola ── pantalla de inicio de sesion
# Se instala en /etc/lightdm/lightdm-gtk-greeter.conf (setup.sh --desktop).
# El fondo se copia a /usr/share/backgrounds/ porque el greeter corre como
# usuario lightdm y no puede leer nada dentro de $HOME.

[greeter]
background = /usr/share/backgrounds/aureola-angel.jpg
theme-name = Adwaita-dark
icon-theme-name = Papirus-Dark
cursor-theme-name = Adwaita
cursor-theme-size = 24
font-name = Comfortaa 11
xft-antialias = true
xft-hinting = true
xft-hintstyle = hintslight
xft-rgba = rgb

panel-position = top
indicators = ~host;~spacer;~clock;~spacer;~session;~language;~power
clock-format = %H:%M  󰫢  %a %d %b

position = 50%,center 58%,center
user-background = false
round-user-image = true
highlight-logged-user = true
hide-user-image = false
