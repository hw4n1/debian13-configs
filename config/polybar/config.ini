; ── aureola ── barra
; Paleta: config/theme/aureola.conf

[colors]
crypt		= #0e0e15
mantle		= #cc12121c
base		= #171622
surface0	= #232232
surface1	= #302f43
overlay		= #565575
subtext		= #9fb0cf
text		= #dee5f3
halo		= #b9d4f0
ice		= #8fbce6
azur		= #5d93c9
rose		= #f2a8c0
blush		= #ef8fa8
lavanda		= #c4b6f2
menta		= #9fe0cf
oro		= #f0dcae

[bar/main]
width		= 100%:-24
height		= 34
offset-x	= 12
offset-y	= 10
radius		= 14
bottom		= false
background	= ${colors.mantle}
foreground	= ${colors.text}
line-size	= 2
border-size	= 0
padding-left	= 1
padding-right	= 2
module-margin	= 2
separator	= "󰫢"
separator-foreground	= ${colors.overlay}
; Quicksand para el texto (redondeada), Nerd Font para los iconos,
; DejaVu como red de seguridad para simbolos sueltos.
font-0	= Comfortaa:style=Regular:size=11;3
font-1	= Maple Mono NF:size=11;3
font-2	= Maple Mono NF:size=14;4
font-3	= DejaVu Sans:size=11;3
modules-left	= menu i3
modules-center	= xwindow
modules-right	= display vpn filesystem memory cpu battery date tray
cursor-click	= pointer
enable-ipc	= true
monitor		= ${env:MONITOR:}
; Barra flotante: i3 no coloca docks donde se le pide, asi que se saca del
; control del WM y el hueco lo reserva `gaps top` en config/i3/config.
override-redirect = true
wm-restack	= i3

; Barra de las pantallas secundarias: identica salvo la bandeja. El systray
; es una seleccion X unica, asi que solo puede vivir en una barra; si se
; monta en dos, la segunda muere entera al no conseguirla.
[bar/aux]
inherit = bar/main
modules-right	= display vpn filesystem memory cpu battery date

[module/menu]
type	= custom/text
format	= "󰋑"
format-font	= 3
format-foreground	= ${colors.rose}
format-padding	= 2
click-left	= rofi -show drun
click-right	= ~/.local/bin/i3-help

[module/i3]
type	= internal/i3
pin-workspaces	= true
strip-wsnumbers	= true
format	= <label-state> <label-mode>
label-mode	= %mode%
label-mode-foreground	= ${colors.lavanda}
label-mode-padding	= 2
label-focused	= %name%
label-focused-font	= 3
label-focused-background	= ${colors.surface1}
label-focused-foreground	= ${colors.rose}
label-focused-underline	= ${colors.rose}
label-focused-padding	= 2
label-unfocused	= %name%
label-unfocused-font	= 3
label-unfocused-foreground	= ${colors.overlay}
label-unfocused-padding	= 2
label-visible	= %name%
label-visible-font	= 3
label-visible-foreground	= ${colors.subtext}
label-visible-padding	= 2
label-urgent	= %name%
label-urgent-font	= 3
label-urgent-background	= ${colors.blush}
label-urgent-foreground	= ${colors.base}
label-urgent-padding	= 2

[module/xwindow]
type	= internal/xwindow
label	= "%title:0:80:…%"
label-foreground	= ${colors.subtext}
label-empty	= "󰫢 nada abierto 󰫢"
label-empty-foreground	= ${colors.overlay}

[module/tray]
type	= internal/tray
tray-spacing	= 6
tray-padding	= 2
tray-background	= ${colors.mantle}

[module/vpn]
type	= custom/script
exec	= ~/.config/polybar/vpn.sh
click-left	= ~/.config/polybar/vpn.sh --next
interval	= 1
format-prefix	= "󰖂 "
format-prefix-foreground	= ${colors.menta}
label	= " %output%"
format-foreground	= ${colors.menta}

[module/memory]
type	= internal/memory
interval	= 2
format-prefix	= "󰋑 "
format-prefix-foreground	= ${colors.lavanda}
label	= " %percentage_used%%"

[module/cpu]
type	= internal/cpu
interval	= 2
format-prefix	= "󰓎 "
format-prefix-foreground	= ${colors.oro}
label	= " %percentage%%"

[module/filesystem]
type	= internal/fs
mount-0	= /
interval	= 30
format-mounted-prefix	= "󰜗 "
format-mounted-prefix-foreground	= ${colors.ice}
label-mounted	= " %percentage_used%%"
label-unmounted	= "󰜗 --"
label-unmounted-foreground	= ${colors.overlay}

[module/battery]
type	= internal/battery
battery	= BAT0
adapter	= AC0
full-at	= 98
low-at	= 15
poll-interval	= 5
format-charging		= <animation-charging> <label-charging>
format-discharging	= <ramp-capacity> <label-discharging>
format-full		= <label-full>
format-low		= <ramp-capacity> <label-low>
label-charging		= " %percentage%%"
label-charging-foreground	= ${colors.menta}
label-discharging	= " %percentage%%"
label-full		= "󰁹  %percentage%%"
label-full-foreground	= ${colors.menta}
label-low		= " %percentage%%"
label-low-foreground	= ${colors.blush}
ramp-capacity-0	= 󰂎
ramp-capacity-1	= 󰁻
ramp-capacity-2	= 󰁽
ramp-capacity-3	= 󰁿
ramp-capacity-4	= 󰂁
ramp-capacity-5	= 󰁹
ramp-capacity-0-foreground	= ${colors.blush}
ramp-capacity-1-foreground	= ${colors.oro}
ramp-capacity-2-foreground	= ${colors.oro}
ramp-capacity-3-foreground	= ${colors.menta}
ramp-capacity-4-foreground	= ${colors.menta}
ramp-capacity-5-foreground	= ${colors.menta}
animation-charging-0	= 󰢜
animation-charging-1	= 󰂆
animation-charging-2	= 󰂈
animation-charging-3	= 󰂉
animation-charging-4	= 󰂋
animation-charging-5	= 󰂅
animation-charging-foreground	= ${colors.menta}
animation-charging-framerate	= 750

[module/date]
type	= internal/date
interval	= 1
date	= %a %d %b
time	= %H:%M
label	= "󰖔  %date%   %time%"
label-foreground	= ${colors.lavanda}

[module/display]
type	= custom/text
format	= "󰍹"
format-foreground	= ${colors.ice}
click-left	= arandr

[settings]
screenchange-reload	= true
pseudo-transparency	= false
