[colors]
base		= #1e1e2e
surface0	= #313244
text		= #cdd6f4
mauve		= #cba6f7
blue		= #89b4fa
green		= #a6e3a1
red		= #f38ba8
yellow		= #f9e2af
peach		= #fab387
teal		= #94e2d5

[bar/main]
width	= 100%
height	= 30
background	= ${colors.base}
foreground	= ${colors.text}
line-size	= 3
padding-left	= 1
padding-right	= 2
module-margin	= 1
font-0	= JetBrainsMono Nerd Font:size=10;3
font-1	= JetBrainsMono Nerd Font:size=13;3
modules-left	= i3
modules-center	= xwindow
modules-right	= display vpn filesystem memory cpu date tray
cursor-click	= pointer
enable-ipc	= true
monitor	= ${env:MONITOR:}

[module/i3]
type	= internal/i3
pin-workspaces	= true
strip-wsnumbers	= true
format	= <label-state> <label-mode>
label-focused	= %name%
label-focused-background	= ${colors.surface0}
label-focused-foreground	= ${colors.mauve}
label-focused-underline	= ${colors.mauve}
label-focused-padding	= 2
label-unfocused	= %name%
label-unfocused-padding	= 2
label-urgent	= %name%
label-urgent-background	= ${colors.red}
label-urgent-foreground	= ${colors.base}
label-urgent-padding	= 2

[module/xwindow]
type	= internal/xwindow
label	= %title:0:80:...%
label-foreground	= ${colors.text}

[module/tray]
type	= internal/tray
tray-spacing	= 6
tray-padding	= 2
tray-background	= ${colors.base}

[module/vpn]
type	= custom/script
exec	= ~/.config/polybar/vpn.sh
click-left	= ~/.config/polybar/vpn.sh --next
interval	= 1
format-prefix = "󰖂 "
format-prefix-foreground	= ${colors.green}
label	= %output%
format-foreground	= ${colors.green}

[module/memory]
type	= internal/memory
interval	= 2
format-prefix = "󰍛 "
format-prefix-foreground	= ${colors.blue}
label	= %percentage_used%%

[module/cpu]
type	= internal/cpu
interval	= 2
format-prefix = "󰻠 "
format-prefix-foreground	= ${colors.peach}
label	= %percentage%%

[module/filesystem]
type    = internal/fs
mount-0 = /
interval = 30
format-prefix = "󰋊 "
format-prefix-foreground = ${colors.teal}
label = %percentage_used%%

[module/date]
type	= internal/date
interval	= 1
date	= %a %d %b
time	= %H:%M
label = "󰃰 %date%  %time%"
label-foreground	= ${colors.mauve}

[module/display]
type	= custom/text
label	= "󰍹"
label-foreground	= ${colors.teal}
click-left	= arandr

[settings]
screenchange-reload	= true
