[colors]
base		= #1e1e2e
surface0	= #313244
text		= #cdd6f4
mauve		= #cba6f7
blue		= #89b4fa
green		= #a6e3a1
red		= #f38ba8
yellow		= #f9e2af
peach		= #fab387
teal		= #94e2d5

[bar/main]
width	= 100%
height	= 30
background	= ${colors.base}
foreground	= ${colors.text}
line-size	= 3
padding-left	= 1
padding-right	= 2
module-margin	= 1
font-0	= JetBrainsMono Nerd Font:size=10;3
font-1	= JetBrainsMono Nerd Font:size=13;3
modules-left	= i3
modules-right	= vpn filesystem memory cpu date
cursor-click	= pointer
enable-ipc	= true

[module/i3]
type	= internal/i3
pinn-workspaces	= true
strip-wsnumbers	= true
format	= <label-state> <label-mode>
label-focused	= %name%
label-focused-background	= ${colors.surface0}
label-focused-foreground	= ${colors.mauve}
label-focused-underline	= ${colors.mauve}
label-focused-padding	= 2
label-unfocused	= %name%
label-unfocused-padding	= 2
label-urgent	= %name%
label-urgent-background	= ${colors.red}
label-urgent-foreground	= ${colors.base}
label-urgent-padding	= 2

[module/xwindow]
type	= internal/xwindow
label	= %title:0:80:...%

[module/vpn]
type	= custom/script
exec	= ~/.config/polybar/vpn.sh
interval	= 3
format-prefix	= "vpn "
format-prefix-foreground	= ${colors.green}
label	= %output%
format-foreground	= ${colors.green}

[module/memory]
type	= internal/memory
interval	= 2
format-prefix	= "ram "
format-prefix-foreground	= ${colors.blue}
label	= %percentage_used%%

[module/cpu]
type	= internal/cpu
interval	= 2
format-prefix	= "cpu "
format-prefix-foreground	= ${colors.peach}
label	= %percentage%%

[module/filesystem]
type	= internal/fs
mount-0	= /
interval = 2
format-prefix	= "cpu "
formal-prefix-foreground	= ${colors.peach}
label	= %percentage%%

[module/date]
type	= internal/date
interval	= 1
date	= %a %d %b
time	= %H:%M
label	= " %date% %time%"
label-foreground	= ${colors.mauve}

[settings]
screenchange-reload	= true
