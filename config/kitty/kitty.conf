# ── aureola ── terminal
# Paleta: config/theme/aureola.conf

font_family	Maple Mono NF
bold_font	Maple Mono NF Bold
italic_font	Maple Mono NF Italic
bold_italic_font	Maple Mono NF Bold Italic
font_size	12.0
disable_ligatures	never
modify_font	cell_height 112%
modify_font	underline_position 2

window_padding_width	16
placement_strategy	center
sync_to_monitor	yes
repaint_delay	8
input_delay	1
hide_window_decorations	yes
confirm_os_window_close	0
scrollback_lines	20000
mouse_hide_wait	2.0
enable_audio_bell	no
window_alert_on_bell	yes
visual_bell_duration	0.12
visual_bell_color	#f2a8c0

background_opacity	0.90
dynamic_background_opacity	yes

cursor_shape	beam
cursor_beam_thickness	2.0
# Parpadeo con easing: se funde en vez de dar saltos
cursor_blink_interval	0.6 ease-in-out
cursor_stop_blinking_after	8.0
# Estela del cursor: los saltos grandes se siguen con la vista
cursor_trail	30
cursor_trail_decay	0.08 0.35
cursor_trail_start_threshold	3

# Pestañas: solo aparecen con 2+, con corazoncito en la activa
tab_bar_edge	top
tab_bar_style	slant
tab_bar_min_tabs	2
tab_title_template	"{fmt.fg._171622}{'󰋑 ' if layout_name else ''}{title}"
active_tab_title_template	"{fmt.fg._171622}󰋑 {title}"

# ── colores ──
foreground	#dee5f3
background	#171622
selection_foreground	#171622
selection_background	#b9d4f0

cursor	#f2a8c0
cursor_text_color	#171622

url_color	#8fbce6
url_style	curly

active_border_color	#b9d4f0
inactive_border_color	#302f43
bell_border_color	#f2a8c0

active_tab_foreground	#171622
active_tab_background	#b9d4f0
active_tab_font_style	bold
inactive_tab_foreground	#9fb0cf
inactive_tab_background	#232232
tab_bar_background	#12121c

mark1_foreground	#171622
mark1_background	#f2a8c0

# ANSI: pasteles de nube
color0	#302f43
color8	#565575
color1	#ef8fa8
color9	#f2a8c0
color2	#9fe0cf
color10	#b7ecdd
color3	#f0dcae
color11	#f7e8c8
color4	#8fbce6
color12	#b9d4f0
color5	#c4b6f2
color13	#d9d0fa
color6	#a9d8ec
color14	#c6e7f5
color7	#dee5f3
color15	#ffffff

# ── atajos ──
map ctrl+shift+o	set_background_opacity +0.03
map ctrl+shift+i	set_background_opacity -0.03
map ctrl+shift+u	set_background_opacity default
