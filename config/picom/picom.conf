# ── aureola ── compositor
# picom v12+: sombras suaves, blur de nube y animaciones con curva propia.

backend	= "glx";
vsync	= true;
use-damage	= true;
dithered-present	= true;

corner-radius	= 16;
rounded-corners-exclude	= [
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"class_g = 'i3-frame'"
];

# Sombra difusa y fria, como el halo del fondo
shadow	= true;
shadow-radius	= 26;
shadow-opacity	= 0.38;
shadow-offset-x	= -22;
shadow-offset-y	= -16;
shadow-color	= "#0e0e15";
shadow-exclude	= [
	"class_g = 'i3-frame'",
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"_NET_WM_STATE@[0] *= '_NET_WM_STATE_HIDDEN'"
];

blur-method	= "dual_kawase";
blur-strength	= 7;
blur-background	= true;
blur-background-exclude = [
	"window_type = 'desktop'",
	"class_g = 'firefox-esr'"
];

# El fade sigue cubriendo lo que las animaciones no tocan
fading	= true;
fade-in-step	= 0.028;
fade-out-step	= 0.028;
fade-delta	= 5;

inactive-opacity	= 0.97;
active-opacity		= 1.0;
frame-opacity		= 1.0;
inactive-opacity-override = false;
opacity-rule	= [
	"92:class_g = 'kitty' && focused",
	"84:class_g = 'kitty' && !focused",
	"96:class_g = 'Rofi'",
	"100:fullscreen"
];

# ── animaciones ──
# Curva ease-out-expo: arranca rapido y se posa despacio, sin rebote.
# La ventana entra creciendo desde el 94 % y anclada a su centro.
animations = (
	{
		triggers = [ "open", "show" ];
		opacity = {
			curve = "cubic-bezier(0.16, 1, 0.30, 1)";
			duration = 0.30;
			start = 0;
			end = "window-raw-opacity";
		};
		blur-opacity = "opacity";
		shadow-opacity = "opacity";
		scale-x = {
			curve = "cubic-bezier(0.16, 1, 0.30, 1)";
			duration = 0.30;
			start = 0.94;
			end = 1;
		};
		scale-y = "scale-x";
		offset-x = "(1 - scale-x) / 2 * window-width";
		offset-y = "(1 - scale-y) / 2 * window-height";
		shadow-scale-x = "scale-x";
		shadow-scale-y = "scale-y";
		shadow-offset-x = "offset-x";
		shadow-offset-y = "offset-y";
	},
	{
		triggers = [ "close", "hide" ];
		opacity = {
			curve = "cubic-bezier(0.32, 0, 0.67, 0)";
			duration = 0.22;
			start = "window-raw-opacity-before";
			end = 0;
		};
		blur-opacity = "opacity";
		shadow-opacity = "opacity";
		scale-x = {
			curve = "cubic-bezier(0.32, 0, 0.67, 0)";
			duration = 0.22;
			start = 1;
			end = 0.96;
		};
		scale-y = "scale-x";
		offset-x = "(1 - scale-x) / 2 * window-width";
		offset-y = "(1 - scale-y) / 2 * window-height";
		shadow-scale-x = "scale-x";
		shadow-scale-y = "scale-y";
		shadow-offset-x = "offset-x";
		shadow-offset-y = "offset-y";
	},
	{
		# Mover y redimensionar (tiling, gaps, resize): que persiga al hueco
		triggers = [ "geometry" ];
		preset = "geometry-change";
		duration = 0.26;
	},
	{
		# Cambio de foco: la opacidad de kitty cruza en vez de saltar
		triggers = [ "increase-opacity", "decrease-opacity" ];
		opacity = {
			curve = "cubic-bezier(0.33, 1, 0.68, 1)";
			duration = 0.18;
			start = "window-raw-opacity-before";
			end = "window-raw-opacity";
		};
		blur-opacity = "opacity";
		shadow-opacity = "opacity";
	}
);

detect-rounded-corners	= true;
detect-client-opacity	= true;
detect-transient	= true;
