backend	= "glx";
vsync	= true;
use-damage	= true;

corner-radius	= 10;
rounded-corners-exclude	= [
	"window_type	= 'dock'",
	"class_g	= 'i3-frame'"
];

shadow = true;
shadow-radius	= 14;
shadow-opacity	= 0.55;
shadow-offset-x	= -14;
shadow-offset-y	= -14;
shadow-exclude	=	[
	"class_g	= 'i3-frame'",
	"_NET_VM_STATE@[0]:32a *= '_NET_VM_STATE_HIDDEN'"
];

blur-method	= "dual_kawase";
blur-strength	= 5;
blur-background	= true;
blur-background-exclude = [
	"window_type	= 'dock'",
	"window_type	= 'desktop'"
];

fading	= true;
fade-in-step	= 0.03;
fade-out-step	= 0.03;

inactive-opacity	= 0.96;
active-opacity	= 1.0;
frame-opacity	= 1.0;
opacity-rule	= [
	"92:class_g	= 'kitty' && focused",
	"84:class_g	= 'kitty' && !focused",
	"100:fullscreen"
];

detect-rounded-corners	= true;
detect-client-opacity	= true;



