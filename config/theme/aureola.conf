# ─────────────────────────────────────────────────────────────
#  aureola — paleta del escritorio
#  Fuente de verdad de los colores. Todos los dotfiles visuales
#  (kitty, polybar, rofi, dunst, i3, gtk, zsh) usan estos hex.
#
#  Sacada del wallpaper config/wallpapers/angel.jpg:
#    #a5b7cf  periwinkle del fondo      -> subtext / azules
#    #d7e0ee  luz del halo              -> text
#    #4877a3  acero de la espada        -> azur / ice
#    #af556e  labios                    -> rose / blush
#    #2b2836  sombra mas profunda       -> base / mantle
#
#  Fichero valido en sintaxis shell: `source aureola.conf` si algun
#  script necesita los colores. Los dotfiles llevan el hex literal
#  porque ni polybar ni rofi ni kitty saben importar variables.
# ─────────────────────────────────────────────────────────────

# Fondos, de mas oscuro a mas claro
AUREOLA_CRYPT="#0e0e15"     # sombras, borde de ventana inactiva
AUREOLA_MANTLE="#12121c"    # fondo de la barra, tooltips
AUREOLA_BASE="#171622"      # fondo principal (terminal, menus)
AUREOLA_SURFACE0="#232232"   # tarjetas, inputs
AUREOLA_SURFACE1="#302f43"   # hover, seleccion suave
AUREOLA_OVERLAY="#565575"    # separadores, texto apagado, placeholders

# Textos
AUREOLA_SUBTEXT="#9fb0cf"    # secundario (periwinkle del fondo)
AUREOLA_TEXT="#dee5f3"       # principal (luz del halo)
AUREOLA_WHITE="#ffffff"      # destellos

# Acentos
AUREOLA_HALO="#b9d4f0"       # acento principal: luz fria del halo
AUREOLA_ICE="#8fbce6"        # azul hielo
AUREOLA_AZUR="#5d93c9"       # acero de la espada
AUREOLA_ROSE="#f2a8c0"       # acento calido: rosa kawaii
AUREOLA_BLUSH="#ef8fa8"      # rosa fuerte: urgencias, errores
AUREOLA_LAVANDA="#c4b6f2"    # lavanda: fechas, modos
AUREOLA_MENTA="#9fe0cf"      # menta: ok, vpn, disco
AUREOLA_ORO="#f0dcae"        # oro palido: avisos, bateria media
